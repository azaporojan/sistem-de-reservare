openapi: 3.1.0
info:
  title: Library Study Room Reservation API
  description: REST API for reserving library study rooms. Authenticate via POST /api/auth/login
    and paste the returned accessToken below.
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- bearerAuth: []
paths:
  /api/users:
    get:
      tags:
      - user-controller
      operationId: listUsers
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
    post:
      tags:
      - user-controller
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/users/{id}/permissions:
    post:
      tags:
      - user-controller
      operationId: grantPermission
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantPermissionRequest"
        required: true
      responses:
        "204":
          description: No Content
    delete:
      tags:
      - user-controller
      operationId: revokePermission
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantPermissionRequest"
        required: true
      responses:
        "204":
          description: No Content
  /api/rooms:
    get:
      tags:
      - room-controller
      operationId: listRooms
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomResponse"
    post:
      tags:
      - room-controller
      operationId: createRoom
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoomResponse"
  /api/reservations/{id}/decline:
    post:
      tags:
      - reservation-controller
      operationId: decline
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationResponse"
  /api/reservations/{id}/confirm:
    post:
      tags:
      - reservation-controller
      operationId: confirm
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationResponse"
  /api/reservations/seat:
    post:
      tags:
      - reservation-controller
      operationId: bookSeat
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookSeatRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationResponse"
  /api/reservations/room:
    post:
      tags:
      - reservation-controller
      operationId: bookRoom
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRoomRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationResponse"
  /api/auth/register:
    post:
      tags:
      - auth-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/refresh:
    post:
      tags:
      - auth-controller
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/users/{id}:
    get:
      tags:
      - user-controller
      operationId: getUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    delete:
      tags:
      - user-controller
      operationId: deleteUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
    patch:
      tags:
      - user-controller
      operationId: updateUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/users/me:
    get:
      tags:
      - user-controller
      operationId: getMe
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    patch:
      tags:
      - user-controller
      operationId: updateMe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/rooms/{id}:
    get:
      tags:
      - room-controller
      operationId: getRoom
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoomResponse"
    delete:
      tags:
      - room-controller
      operationId: deleteRoom
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
    patch:
      tags:
      - room-controller
      operationId: updateRoom
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoomRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoomResponse"
  /api/rooms/{id}/seats:
    get:
      tags:
      - room-controller
      operationId: seatMap
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: start
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: end
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SeatMapResponse"
  /api/rooms/{id}/availability:
    get:
      tags:
      - room-controller
      operationId: availability
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
  /api/reservations:
    get:
      tags:
      - reservation-controller
      operationId: listAll
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReservationResponse"
  /api/reservations/{id}:
    get:
      tags:
      - reservation-controller
      operationId: getById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationResponse"
    delete:
      tags:
      - reservation-controller
      operationId: cancel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationResponse"
  /api/reservations/my:
    get:
      tags:
      - reservation-controller
      operationId: listMy
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReservationResponse"
components:
  schemas:
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        fullName:
          type: string
        role:
          type: string
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
        enabled:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    GrantPermissionRequest:
      type: object
      properties:
        permission:
          type: string
    CreateRoomRequest:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
        capacity:
          type: integer
          format: int32
        description:
          type: string
    RoomResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        location:
          type: string
        capacity:
          type: integer
          format: int32
        description:
          type: string
        active:
          type: boolean
    ReviewRequest:
      type: object
      properties:
        note:
          type: string
    ReservationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        roomId:
          type: integer
          format: int64
        roomName:
          type: string
        seatId:
          type: integer
          format: int64
        seatLabel:
          type: string
        type:
          type: string
          enum:
          - ROOM
          - SEAT
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        seatsRequested:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - COMPLETED
          - DECLINED
          - CANCELLED
        notes:
          type: string
        reviewedBy:
          type: string
          format: uuid
        reviewNote:
          type: string
        createdAt:
          type: string
          format: date-time
    BookSeatRequest:
      type: object
      properties:
        roomId:
          type: integer
          format: int64
        seatId:
          type: integer
          format: int64
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        notes:
          type: string
    BookRoomRequest:
      type: object
      properties:
        roomId:
          type: integer
          format: int64
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        notes:
          type: string
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        fullName:
          type: string
        role:
          type: string
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    UpdateUserRequest:
      type: object
      properties:
        fullName:
          type: string
        password:
          type: string
        enabled:
          type: boolean
        role:
          type: string
    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
        password:
          type: string
    UpdateRoomRequest:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
        capacity:
          type: integer
          format: int32
        description:
          type: string
        active:
          type: boolean
    SeatMapResponse:
      type: object
      properties:
        roomId:
          type: integer
          format: int64
        roomName:
          type: string
        rows:
          type: integer
          format: int32
        cols:
          type: integer
          format: int32
        roomBooked:
          type: boolean
        roomBookedBy:
          type: string
        seats:
          type: array
          items:
            $ref: "#/components/schemas/SeatStatusDto"
    SeatStatusDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        row:
          type: integer
          format: int32
        col:
          type: integer
          format: int32
        booked:
          type: boolean
        status:
          type: string
          enum:
            - FREE
            - PENDING
            - CONFIRMED
        bookedBy:
          type: string
        reservationId:
          type: string
          format: uuid
    AvailabilityRequest:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    AvailabilityResponse:
      type: object
      properties:
        roomId:
          type: integer
          format: int64
        available:
          type: boolean
        conflictingSlots:
          type: array
          items:
            $ref: "#/components/schemas/SlotDto"
    SlotDto:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      description: Paste your JWT access token here
      scheme: bearer
      bearerFormat: JWT
