services:

  postgres:
    image: postgres:17-alpine
    container_name: reservare-postgres
    environment:
      POSTGRES_DB: reservare_db
      POSTGRES_USER: reservare
      POSTGRES_PASSWORD: reservare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservare -d reservare_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: reservare-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reservare_db
      SPRING_DATASOURCE_USERNAME: reservare
      SPRING_DATASOURCE_PASSWORD: reservare
      JWT_SECRET: local-dev-secret-replace-in-prod-must-be-long-enough
    ports:
      - "8080:8080"

volumes:
  postgres_data:
